<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Lumiere - Reimagine Movie Endings</title>
    <meta
      name="description"
      content="Lumiere is a community-driven platform where cinephiles reimagine and share alternate endings for movies."
    />
    <meta name="author" content="Lumiere" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/favicon%20(2).jpeg" />

    <!-- Preconnects for external domains (must be before any resource requests) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: preload + stylesheet (non-render-blocking) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Lumiere - Reimagine Movie Endings" />
    <meta
      property="og:description"
      content="Discover and write alternate movie endings. A home for cinephiles who love to ask: what if?"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lumiereofficial.online" />
    <meta property="og:image" content="/favicon%20(2).jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumiere - Reimagine Movie Endings" />
    <meta
      name="twitter:description"
      content="A cinephile community to explore and write alternate endings for movies."
    />
    <meta name="twitter:image" content="/favicon%20(2).jpeg" />
    <meta
      name="google-site-verification"
      content="_8e95aZ4wFROfn2E_ieplQgm5M_rLsZQq9uxQIVLZ3M"
    />
    <script
      defer
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6896379656717871"
      crossorigin="anonymous"
    ></script>
  </head>
